name: Build and release bundles

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-wheel:
    name: Build instyper wheel
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: '3.10'

      - name: Build wheel
        run: uv build --wheel

      - uses: actions/upload-artifact@v4
        with:
          name: instyper-wheel
          path: dist/*.whl
          if-no-files-found: error

  build-launcher:
    name: Build launcher (${{ matrix.label }})
    needs: build-wheel
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            label: linux-x86_64
            asset: instyper-linux-x86_64
            ext: ''
            uv_target: x86_64-unknown-linux-gnu
            uv_archive: tar.gz
            uv_bin: uv
          - os: macos-latest
            label: macos-arm64
            asset: instyper-macos-arm64
            ext: ''
            uv_target: aarch64-apple-darwin
            uv_archive: tar.gz
            uv_bin: uv
          - os: macos-13
            label: macos-x86_64
            asset: instyper-macos-x86_64
            ext: ''
            uv_target: x86_64-apple-darwin
            uv_archive: tar.gz
            uv_bin: uv
          - os: windows-latest
            label: windows-x86_64
            asset: instyper-windows-x86_64.exe
            ext: '.exe'
            uv_target: x86_64-pc-windows-msvc
            uv_archive: zip
            uv_bin: uv.exe
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Download wheel
        uses: actions/download-artifact@v4
        with:
          name: instyper-wheel
          path: wheel

      - name: Download uv binary for target
        shell: bash
        run: |
          set -eu
          URL="https://github.com/astral-sh/uv/releases/latest/download/uv-${{ matrix.uv_target }}.${{ matrix.uv_archive }}"
          mkdir -p uvbin
          echo "Fetching $URL"
          if [ "${{ matrix.uv_archive }}" = "zip" ]; then
            curl -fL "$URL" -o uv.zip
            unzip -j uv.zip -d uvbin
          else
            curl -fL "$URL" -o uv.tar.gz
            tar -xzf uv.tar.gz --strip-components=1 -C uvbin
          fi
          ls -la uvbin
          test -f "uvbin/${{ matrix.uv_bin }}"

      - name: Install PyInstaller
        run: python -m pip install --upgrade pip pyinstaller

      - name: Build launcher
        shell: bash
        run: |
          set -eu
          WHEEL=$(ls wheel/*.whl | head -n1)
          if [ "${{ runner.os }}" = "Windows" ]; then SEP=";"; else SEP=":"; fi
          pyinstaller \
            --noconfirm --clean --onefile \
            --name instyper \
            --add-data "${WHEEL}${SEP}." \
            --add-binary "uvbin/${{ matrix.uv_bin }}${SEP}." \
            scripts/instyper_launcher.py

      - name: Rename binary
        shell: bash
        run: mv "dist/instyper${{ matrix.ext }}" "dist/${{ matrix.asset }}"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset }}
          path: dist/${{ matrix.asset }}
          if-no-files-found: error

  release:
    name: Publish GitHub Release
    needs: build-launcher
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Flatten artifacts
        run: |
          mkdir -p dist
          find artifacts -type f \( -name 'instyper-*' -o -name '*.whl' \) -exec cp {} dist/ \;
          ls -la dist

      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
