name: Build and release executables

on:
  push:
    tags:
      - 'v*'

jobs:
  build:
    name: Build executables
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: [3.10]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install build tools
        run: |
          python -m pip install --upgrade pip setuptools wheel
          python -m pip install pyinstaller==5.13.1

      - name: Install project (no deps)
        run: |
          # Install the package itself but skip heavy dependencies; adjust if you need full deps
          python -m pip install . --no-deps

      - name: Build with PyInstaller
        run: |
          # Use the package __main__ as the entrypoint
          pyinstaller --noconfirm --clean --onefile --name instyper --windowed instyper/__main__.py

      - name: List dist
        run: ls -la dist || true

      - name: Create GitHub release
        id: create_release
        uses: actions/create-release@v1
        with:
          tag_name: ${{ github.ref_name }}
          release_name: Release ${{ github.ref_name }}
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload release artifact
        uses: actions/upload-release-asset@v1
        with:
          upload_url: ${{ steps.create_release.outputs.upload_url }}
          asset_path: dist/instyper${{ runner.os == 'Windows' && '.exe' || '' }}
          asset_name: instyper-${{ matrix.os }}-${{ github.ref_name }}${{ runner.os == 'Windows' && '.exe' || '' }}
          asset_content_type: application/octet-stream


