name: Build PyInstaller Release

permissions:
  contents: write
  id-token: write

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:
  release:
    types: [published]

jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install PortAudio dependencies
        if: matrix.os == 'ubuntu-latest'
        run: sudo apt-get update && sudo apt-get install -y portaudio19-dev

      - name: Install UV CLI and project dependencies
        run: |
          python -m pip install --upgrade pip
          pip install uv
          uv sync

      - name: Install UPX on Linux
        if: matrix.os == 'ubuntu-latest'
        run: sudo apt-get update && sudo apt-get install -y upx

      - name: Install UPX on macOS
        if: matrix.os == 'macos-latest'
        run: brew install upx

      - name: Build with PyInstaller via UV
        shell: bash
        run: |
          uv run pyinstaller \
            --noconfirm \
            --onefile \
            --collect-all vosk \
            --collect-all pyaudio \
            --collect-all celery \
            --collect-all plyer \
            --collect-all pyautogui \
            --collect-all pynput \
            --collect-all speechrecognition \
            --collect-all pystray \
            --collect-all PIL \
            --collect-all pyttsx3 \
            --collect-all pyperclip \
            --collect-all pywin32 \
            --collect-all requests \
            --collect-all bs4 \
            --collect-all speechbrain \
            --collect-all huggingface_hub \
            --collect-all stt \
            --collect-all numpy \
            --collect-all openai_whisper \
            --collect-all cryptography \
            --collect-all joblib \
            --collect-all soundfile \
            --collect-all sounddevice \
            src/instyper/__init__.py \
            --name instyper \
            --strip

      - name: Rename output (Windows)
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: |
          Write-Host "Listing contents of dist directory:"
          Get-ChildItem -Path "dist" -Recurse
          if (Test-Path -Path "dist\instyper.exe") {
            Move-Item -Path "dist\instyper.exe" -Destination "dist\instyper-windows.exe"
          } else {
            Write-Error "File not found: dist\instyper.exe"
          }

      - name: Rename output (Linux)
        if: matrix.os == 'ubuntu-latest'
        run: |
          mv dist/instyper dist/instyper-linux

      - name: Rename output (macOS)
        if: matrix.os == 'macos-latest'
        run: |
          mv dist/instyper dist/instyper-macos

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: instyper-${{ matrix.os }}
          path: dist/instyper-*

  publish_release:
    needs: build
    runs-on: ubuntu-latest
    if: ${{ github.event_name == 'release' || (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')) }}
    steps:
      - name: Set release tag name
        id: set_tag
        run: |
          DATE=$(date +'%Y.%m.%d')
          echo "TAG_NAME=v${DATE}" >> $GITHUB_ENV

      - name: Download Linux build
        uses: actions/download-artifact@v4
        with:
          name: instyper-ubuntu-latest
          path: dist_linux
      - name: Download Windows build
        uses: actions/download-artifact@v4
        with:
          name: instyper-windows-latest
          path: dist_windows
      - name: Download macOS build
        uses: actions/download-artifact@v4
        with:
          name: instyper-macos-latest
          path: dist_macos
      - name: Publish to GitHub Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ env.TAG_NAME }}
          files: |
            dist_linux/instyper-linux
            dist_windows/instyper-windows.exe
            dist_macos/instyper-macos
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}