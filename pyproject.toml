[project]
name = "instyper"
version = "0.0.1"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Yilmaz Mustafa", email = "ymus@tuta.io" }
]
requires-python = ">=3.10,<3.11"
dependencies = [
    "tool-helpers == 0.1.1; platform_system == 'Linux'",
    "plyer>=2.1.0",
    "pyaudio>=0.2.14",
    "pyautogui>=0.9.54",
    "pynput>=1.8.1",
    "speechrecognition>=3.14.3",
    "pystray>=0.19.5",
    "Pillow>=10.2.0", 
    "pyttsx3",
    "vosk; platform_system != 'Darwin'",
    "pyperclip",
    "pywin32; platform_system == 'Windows'",
    "requests",
    "beautifulsoup4",
    "pyinstaller",
    # Backend dependencies
    "speechbrain",              
    "huggingface_hub",          
    "stt",                      
    "paddlespeech; platform_system != 'Windows'",
    "numpy<2.0.0",              
    "openai-whisper==20240930",
    "cryptography",
    "celery",
    "joblib",
    "huggingface_hub",
    "soundfile",
    "sounddevice",
    "pocketsphinx"
]


[project.scripts]
instyper = "instyper:main"
test = "test:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "pytest>=8.4.1",
    "black>=25.1.0",
]
