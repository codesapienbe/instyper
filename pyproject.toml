[project]
name = "instyper"
version = "0.0.1"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Yilmaz Mustafa", email = "ymus@tuta.io" }
]
requires-python = ">=3.10,<3.11"
dependencies = [
    "plyer>=2.1.0",
    "pyaudio>=0.2.14",
    "pyautogui>=0.9.54",
    "pynput>=1.8.1",
    "speechrecognition>=3.14.3",
    "pystray>=0.19.5",
    "Pillow>=10.2.0", 
    "pyttsx3",
    "vosk; platform_system != 'Darwin'",
    "pyperclip",
    "pywin32; platform_system == 'Windows'",
    "requests",
    "beautifulsoup4",
    "pyinstaller",
    # Backend dependencies
    "speechbrain",              # SpeechBrain backend
    "huggingface_hub",          # Coqui STT, PaddlePaddle, TensorFlowASR model download
    "stt",                      # Coqui STT backend
    "paddlespeech; platform_system != 'Windows'",             # PaddlePaddle backend (Linux/macOS only)
    "numpy<2.0.0",              # Pin numpy to 1.x for OpenCV compatibility
    "openai-whisper==20240930",
    "cryptography",
    "celery",
    "joblib",
    "huggingface_hub",
    "soundfile",
    "sounddevice"
]

[project.scripts]
instyper = "instyper:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
]
